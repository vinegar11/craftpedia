<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тесты Minecraft — Craftpedia</title>
<style>
:root{--bg:#080d12;--panel:#101923;--panel2:#151f2b;--line:#263545;--text:#eef5fb;--muted:#a3b4c6;--green:#42f59b;--blue:#78baff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 5%,#143b2c 0%,transparent 34%),radial-gradient(ellipse at 88% 28%,#102b42 0%,transparent 30%),radial-gradient(ellipse at 50% -15%,#15392d 0%,var(--bg) 55%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(18px,5vw,76px);background:#080d12eF;border-bottom:1px solid var(--line)}.brand{font-weight:950;letter-spacing:1.8px;font-size:21px}.brand span{color:var(--green)}main{max-width:900px;margin:auto;padding:42px 20px 70px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 10px}.sub{color:var(--muted);font-size:14px;line-height:1.7}.panel{margin-top:24px;background:linear-gradient(160deg,#121d28ef,#0d141cf7);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,30px)}.btn{border:1px solid #3b8c68;background:linear-gradient(135deg,#164b34,#123b2b);color:#eafff3;padding:11px 16px;border-radius:11px;cursor:pointer;font-weight:750}.btn:hover{background:#1d6746}.btn:disabled{opacity:.6;cursor:default}.btn.secondary{background:#111c27;border-color:var(--line);color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{padding:18px;background:#0b131c;border:1px solid var(--line);border-radius:14px}.tile h3{margin:0 0 8px}.tile p{color:var(--muted);font-size:14px;line-height:1.6}.tile button{margin-top:12px}.option{display:block;width:100%;text-align:left;margin-top:10px;padding:14px;background:#0b131c;color:var(--text);border:1px solid #2b3b4c;border-radius:12px;cursor:pointer}.option:hover:not(:disabled){border-color:var(--green);background:#12271f}.option.correct{border-color:#3de18b;background:#123526}.option.wrong{border-color:#ff7070;background:#351919}.progress{height:6px;background:#263443;border-radius:10px;overflow:hidden;margin:18px 0 24px}.progress div{height:100%;width:0;background:var(--green);transition:width .2s}#feedback{color:var(--muted);line-height:1.7;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div class="brand">CRAFT<span>PEDIA</span></div><a class="btn secondary" href="index.html" id="homeLink">← На главную</a></header><main><div class="sub">CRAFTPEDIA · ПРОВЕРЬ СЕБЯ</div><h1 id="pageTitle">Тесты по Minecraft</h1><p class="sub" id="intro">Выбери тему и проверь свои знания.</p><section class="panel" id="chooser"><p class="sub">Выбери один из тестов ниже. В любой момент можно вернуться в каталог.</p><div class="grid" id="tiles"></div><div class="actions"><a class="btn secondary" href="index.html#quizHub" style="text-decoration:none">← На главную к тестам</a><a class="btn secondary" href="index.html#allBlocks" style="text-decoration:none">🧱 Каталог блоков</a></div></section><section class="panel" id="play" hidden><div class="sub" id="counter"></div><div class="progress"><div id="bar"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback"></div><div class="actions" id="actions"></div></section></main>
<script>
const quizBank={
 pvp:[
  {q:"Что помогает уменьшить получаемый урон от большинства атак спереди?",a:["Щит","Компас","Подзорная труба","Удочка"],c:0,e:"Щит блокирует многие атаки, если правильно держать его перед собой."},
  {q:"Что обычно требуется для критического удара мечом в Java Edition?",a:["Атаковать во время падения после прыжка","Стоять в воде","Присесть без движения","Держать факел"],c:0,e:"Критический удар выполняется в подходящей фазе падения, а не просто при прыжке вверх."},
  {q:"Какое зелье может помочь в бою против противника, использующего огонь?",a:["Огнестойкость","Ночное зрение","Прыгучесть","Подводное дыхание"],c:0,e:"Огнестойкость защищает от урона огнём и лавой на время действия."}
 ],
 build:[
  {q:"Что помогает сделать фасад здания визуально глубже?",a:["Добавить выступы, ниши и ступени","Сделать всё одной плоской стеной","Использовать только один блок везде","Убрать окна и крышу"],c:0,e:"Выступы и ниши создают тени и визуальную глубину."},
  {q:"Что такое палитра блоков в строительстве?",a:["Набор сочетающихся материалов и цветов","Список серверов","Настройка чувствительности мыши","Таблица зачарований"],c:0,e:"Палитра — заранее выбранные блоки, которые сочетаются по цвету и фактуре."},
  {q:"Как сделать большую стену менее однообразной?",a:["Разделить её деталями и менять фактуру","Залить всю стену одним блоком","Убрать все углы","Поставить случайные блоки без идеи"],c:0,e:"Повторяющиеся элементы и несколько сочетающихся фактур делают стену интереснее."}
 ],
 redstone:[
  {q:"Для чего нужен редстоуновый повторитель?",a:["Задерживать и обновлять сигнал","Хранить предметы","Ускорять игрока","Освещать комнату"],c:0,e:"Повторитель передаёт сигнал дальше и позволяет задавать задержку."},
  {q:"Что умеет редстоуновый компаратор?",a:["Сравнивать сигналы и считывать заполненность некоторых контейнеров","Создавать алмазы","Телепортировать блоки","Автоматически чинить инструменты"],c:0,e:"Компаратор работает с силой сигнала, в том числе от контейнеров."},
  {q:"Какой компонент может толкать блоки при активации?",a:["Поршень","Наковальня","Стол картографа","Котёл"],c:0,e:"Поршень толкает блоки в пределах игровых ограничений."}
 ],
 knowledge:[
  {q:"Какой ресурс нужен для создания стола зачаровывания?",a:["Алмазы, обсидиан и книга","Медь, песок и палка","Железо и шерсть","Редстоун и глина"],c:0,e:"Рецепт включает 4 обсидиана, 2 алмаза и книгу."},
  {q:"Какой инструмент эффективнее всего добывает камень?",a:["Кирка","Мотыга","Ножницы","Удочка"],c:0,e:"Каменные блоки добывают киркой; неподходящий инструмент может не дать дроп."},
  {q:"Что обычно нужно для активации портала в Край?",a:["Око Эндера в каждом пустом слоте рамки","Огниво на обсидиане","Ведро воды","Редстоуновый факел"],c:0,e:"Рамка портала активируется глазами Эндера в пустых блоках рамки."}
 ],
 bosses:[
  {q:"Как называется босс, которого находят в измерении Край?",a:["Дракон Края","Варден","Древний страж","Поборник"],c:0,e:"Дракон Края — босс измерения Край."},
  {q:"Какой моб накладывает эффект иссушения своими атаками?",a:["Иссушитель","Слизень","Страж","Лиса"],c:0,e:"Иссушитель атакует черепами и накладывает эффект иссушения."},
  {q:"Что обычно безопаснее делать при встрече с Варденом, если цель — выжить?",a:["Тихо отступить и избегать вибраций","Сразу атаковать вблизи","Привести его в базу","Постоянно прыгать рядом"],c:0,e:"Варден крайне опасен; избегание и скрытное отступление часто лучше прямого боя."}
 ]
};
quizBank.mixed=[...quizBank.pvp,...quizBank.build,...quizBank.redstone,...quizBank.knowledge,...quizBank.bosses];
const topics={pvp:{title:"PvP и тактика",desc:"Дистанция, щиты и выбор снаряжения."},build:{title:"Строительство",desc:"Материалы, палитры и композиция."},redstone:{title:"Редстоун и механизмы",desc:"Повторители, компараторы и логика сигналов."},knowledge:{title:"Основы Minecraft",desc:"Рецепты, инструменты и игровые механики."},bosses:{title:"Боссы и мобы",desc:"Опасные противники и выживание."},mixed:{title:"Мастер Minecraft",desc:"Смешанный тест по всем темам."}};
const params=new URLSearchParams(location.search);let selected=params.get('topic');if(!topics[selected])selected=null;
const chooser=document.getElementById('chooser'),play=document.getElementById('play'),tiles=document.getElementById('tiles');
const titles=document.getElementById('pageTitle'),intro=document.getElementById('intro');
function chooseTopic(topic){location.href='test.html?topic='+encodeURIComponent(topic)}
function renderChooser(){tiles.replaceChildren();Object.entries(topics).forEach(([key,t])=>{const card=document.createElement('article');card.className='tile';const h=document.createElement('h3');h.textContent=t.title;const p=document.createElement('p');p.textContent=t.desc;const b=document.createElement('button');b.className='btn';b.textContent='Начать тест';b.addEventListener('click',()=>start(key));card.append(h,p,b);tiles.append(card)});}
let current=[],pos=0,score=0,locked=false,currentTopic='mixed';
function start(topic){currentTopic=topic;current=[...quizBank[topic]].sort(()=>Math.random()-.5);pos=0;score=0;chooser.hidden=true;play.hidden=false;titles.textContent=topics[topic].title;intro.textContent='Отвечай на вопросы и смотри объяснения после каждого ответа.';showQuestion();}
function showQuestion(){locked=false;const item=current[pos];document.getElementById('counter').textContent=`Вопрос ${pos+1} из ${current.length} · Очки: ${score}`;document.getElementById('bar').style.width=(pos/current.length*100)+'%';document.getElementById('question').textContent=item.q;document.getElementById('feedback').textContent='';const opts=document.getElementById('options');opts.replaceChildren();const actions=document.getElementById('actions');actions.replaceChildren();item.a.forEach((label,i)=>{const b=document.createElement('button');b.className='option';b.textContent=label;b.addEventListener('click',()=>answer(i,b,item));opts.append(b)});}
function answer(i,button,item){if(locked)return;locked=true;const opts=[...document.querySelectorAll('.option')];opts.forEach((b,j)=>{b.disabled=true;if(j===item.c)b.classList.add('correct')});if(i===item.c)score++;else button.classList.add('wrong');document.getElementById('feedback').textContent=(i===item.c?'✅ Верно! ':'❌ Не совсем. ')+item.e;const next=document.createElement('button');next.className='btn';next.textContent=pos===current.length-1?'Показать результат':'Следующий вопрос';next.addEventListener('click',()=>{pos++;if(pos<current.length)showQuestion();else result()});document.getElementById('actions').append(next);}
function result(){document.getElementById('bar').style.width='100%';document.getElementById('counter').textContent='Тест завершён';document.getElementById('question').textContent=`Твой результат: ${score} из ${current.length}`;document.getElementById('options').replaceChildren();document.getElementById('feedback').textContent=score===current.length?'Идеально! Ты ответил на всё правильно.':score>=Math.ceil(current.length*.7)?'Отличный результат! Ещё немного — и будешь экспертом.':'Есть куда расти — изучи каталог и попробуй снова.';const a=document.getElementById('actions');a.replaceChildren();const again=document.createElement('button');again.className='btn';again.textContent='Пройти ещё раз';again.addEventListener('click',()=>start(currentTopic));const back=document.createElement('button');back.className='btn secondary';back.textContent='Выбрать другую тему';back.addEventListener('click',()=>{play.hidden=true;chooser.hidden=false;titles.textContent='Тесты по Minecraft';intro.textContent='Выбери тему и проверь свои знания.';renderChooser()});a.append(again,back);}
renderChooser();if(selected)start(selected);
</script></body></html>
